packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm 11 fails installs on unapproved build scripts. fsevents (via vite, macOS only) ships a
# prebuilt binary, so its node-gyp step is not needed. node-pty and better-sqlite3 must run their
# install step: each uses a prebuild where one exists and compiles otherwise (Linux CI compiles).
allowBuilds:
  better-sqlite3: true
  fsevents: false
  node-pty: true

# The runners SDK is pinned exactly and ships almost daily, so its pin is usually younger than
# pnpm's minimum release age. pnpm wrote these; bump them together with the pin.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.284"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.284"
  - "@anthropic-ai/claude-agent-sdk@0.3.284"
